# Production overrides for a single EC2 host. Usage (done by infra/aws/bootstrap.sh):
#   docker compose -f docker-compose.yml -f infra/aws/docker-compose.prod.yml up -d
# Only Caddy publishes ports (80/443); every other service is reachable only on the private Docker network.
services:
  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web, keycloak]
    restart: unless-stopped

  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  keycloak:
    command: ["start", "--import-realm", "--proxy-headers", "xforwarded", "--http-enabled", "true", "--health-enabled", "true"]
    environment:
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HTTP_RELATIVE_PATH: /auth
    volumes: !override
      - ./infra/keycloak/prod/retail-realm.json:/opt/keycloak/data/import/retail-realm.json:ro
    ports: !reset []
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-retail-platform-api}
    command: ["uvicorn", "retail_platform.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      RP_ENV: production
      RP_OIDC_ISSUER: https://${DOMAIN}/auth/realms/retail
      RP_OIDC_JWKS_URL: http://keycloak:8080/auth/realms/retail/protocol/openid-connect/certs
      RP_CORS_ORIGINS: '["https://${DOMAIN}"]'
      RP_OLLAMA_URL: https://ollama.com
      RP_LLM_MODEL: ${RP_LLM_MODEL:-gemma4:31b}
      HF_HUB_OFFLINE: "0"
    volumes: !override
      - hfcache:/app/.cache/huggingface
    ports: !reset []
    restart: unless-stopped

  pipeline:
    image: ${PIPELINE_IMAGE:-retail-platform-pipeline}

  web:
    image: ${WEB_IMAGE:-retail-platform-web}
    ports: !reset []
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  hfcache:
