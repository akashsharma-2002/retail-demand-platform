name: deploy

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          TAG=${GITHUB_SHA::12}
          docker build -t ghcr.io/${{ github.repository }}/api:$TAG .
          docker build -t ghcr.io/${{ github.repository }}/web:$TAG web
          docker push ghcr.io/${{ github.repository }}/api:$TAG
          docker push ghcr.io/${{ github.repository }}/web:$TAG
      - name: Assume deploy role (OIDC, no stored AWS keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll out via SSM Run Command
        run: |
          TAG=${GITHUB_SHA::12}
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters commands="[\"sudo -u retail /opt/retail/infra/aws/deploy.sh $TAG\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}'
