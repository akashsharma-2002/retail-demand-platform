[project]
name = "retail-platform"
version = "1.0.0"
description = "Retail demand forecasting, replenishment optimisation and planner assistant"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.8",
  "pyarrow>=17",
  "pandera[polars]>=0.20",
  "lightgbm>=4.5",
  "ortools>=9.11",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "slowapi>=0.1.9",
  "prometheus-client>=0.21",
  "redis>=5.0",
  "structlog>=24.4",
  "rank-bm25>=0.2.2",
  "langgraph>=0.2.30",
  "fastmcp>=2.3",
  "openai>=1.50",
  "langfuse>=2.50",
  "torch>=2.4",
  "alembic>=1.13",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.1"]
# Nightly pipeline only; kept out of the API image (smaller image, fewer packages to patch).
pipeline = ["mlflow-skinny>=2.16", "prefect>=3.0", "statsforecast>=2.0.1", "neuralforecast>=1.7"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "locust>=2.31",
  "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_platform"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"evals/**" = ["S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs downloaded data or models"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# neuralforecast 3.2.2 pins pytorch-lightning<2.6.0, which carries CVE-2026-31221 and CVE-2026-58659 (unsafe
# checkpoint loading). 2.6.6 fixes both; TFT training was re-verified with it (see README, Security).
override-dependencies = ["pytorch-lightning>=2.6.6"]
