# Local stack. Production overrides live in infra/aws/docker-compose.prod.yml.
name: retail-platform

x-app-env: &app-env
  RP_ENV: ${RP_ENV:-local}
  RP_DATABASE_URL: postgresql+psycopg://app_write:${APP_WRITE_PASSWORD:?set in .env}@postgres:5432/retail
  RP_REDIS_URL: redis://redis:6379/0
  RP_OIDC_ISSUER: ${OIDC_PUBLIC_URL:-http://localhost:8080}/realms/retail
  RP_OIDC_JWKS_URL: http://keycloak:8080/realms/retail/protocol/openid-connect/certs
  RP_CORS_ORIGINS: '["${WEB_ORIGIN:-http://localhost:5173}"]'
  RP_RAG_MODE: ${RP_RAG_MODE:-hybrid_rerank}
  RP_LLM_PROVIDER: ${RP_LLM_PROVIDER:-ollama}
  RP_LLM_MODEL: ${RP_LLM_MODEL:-gemma4:31b-cloud}
  RP_OLLAMA_URL: ${RP_OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}

services:
  postgres:
    image: paradedb/paradedb:0.25.9-pg17
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      APP_WRITE_PASSWORD: ${APP_WRITE_PASSWORD}
      APP_READ_PASSWORD: ${APP_READ_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      # TCP check: the temporary server used during first-time initialisation only listens on a socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d retail"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${OIDC_PUBLIC_URL:-http://localhost:8080}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
    volumes:
      - ./infra/keycloak/retail-realm.json:/opt/keycloak/data/import/retail-realm.json:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    image: retail-platform-api
    environment:
      <<: *app-env
      HF_HUB_OFFLINE: "1"
    volumes:
      # Local only: reuse models already downloaded on the host instead of a second 4.5 GB copy.
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/app/.cache/huggingface
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  pipeline:
    build:
      context: .
      args:
        EXTRAS: "--extra embeddings --extra pipeline"
    image: retail-platform-pipeline
    profiles: ["pipeline"]
    command: ["python", "-m", "retail_platform.pipeline.flow"]
    environment:
      <<: *app-env
      RP_DATABASE_URL: postgresql+psycopg://app_write:${APP_WRITE_PASSWORD}@postgres:5432/retail
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
      - hfcache:/app/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}

  web:
    build: ./web
    image: retail-platform-web
    ports: ["127.0.0.1:5173:8080"]
    depends_on: [api]

volumes:
  pgdata:
  hfcache:
